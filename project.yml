name: MeetingNotes
options:
  bundleIdPrefix: com.vivek.meetingnotes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  MeetingNotes:
    type: application
    platform: iOS
    sources:
      - path: MeetingNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivek.meetingnotes
        INFOPLIST_FILE: MeetingNotes/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
  MeetingNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeetingNotesTests
    dependencies:
      - target: MeetingNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vivek.meetingnotes.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MeetingNotes:
    build:
      targets:
        MeetingNotes: all
        MeetingNotesTests: [test]
    test:
      targets:
        - MeetingNotesTests
